<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>pyimgtag dashboard</title><style>{{ design_css }}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
           gap:12px;padding:20px 32px 0}
.pill-state{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
            border:1px solid var(--border);background:var(--surface)}
.pill-state.running{color:var(--ok);border-color:var(--ok)}
.pill-state.pausing,.pill-state.paused{color:var(--warn);border-color:var(--warn)}
.pill-state.failed,.pill-state.interrupted{color:var(--danger);border-color:var(--danger)}
.recent-list{list-style:none;margin:0 32px;border-top:1px solid var(--border)}
.recent-li{display:flex;align-items:center;gap:8px;padding:8px 0;
           border-bottom:1px solid var(--border);font-size:12px}
.recent-status{font-weight:700;font-size:10px;text-transform:uppercase;min-width:36px}
.recent-status.ok{color:var(--ok)}.recent-status.error{color:var(--danger)}
.recent-path{font-family:ui-monospace,'SF Mono',monospace;color:var(--muted);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#current{font-family:ui-monospace,'SF Mono',monospace;font-size:13px;color:var(--muted);
         padding:12px 32px 0;word-break:break-all}
#current a,.recent-path a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
#current a:hover,.recent-path a:hover{color:var(--accent);border-bottom-color:var(--accent)}
#error{color:var(--danger);font-size:13px;padding:8px 32px 0}
.ctrl-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;
          border:1px solid var(--border);background:var(--surface);color:var(--text);
          cursor:pointer;transition:all .15s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>{{ nav }}
<div class="page-hdr" style="flex-wrap:wrap;gap:10px">
  <h1 class="page-title">Dashboard</h1>
  <span id="state" class="pill-state">idle</span>
  <span id="command" style="font-size:13px;color:var(--muted)"></span>
  <span style="flex:1"></span>
  <button id="pauseBtn" class="ctrl-btn">Pause</button>
  <button id="unpauseBtn" class="ctrl-btn" disabled>Unpause</button>
  <button id="stopBtn" class="ctrl-btn" style="color:var(--danger);border-color:var(--danger)" disabled>Stop</button>
</div>
<div id="current">(no active item)</div>
<div id="idle-empty" style="padding:0 32px"></div>
<div class="dash-grid" id="counters"></div>
<div id="error"></div>
<div style="padding:20px 32px 0">
  <p style="font-size:11px;font-weight:600;text-transform:uppercase;
            letter-spacing:.8px;color:var(--muted);margin-bottom:10px">Recent</p>
  <ul id="recent" class="recent-list"></ul>
</div>
<script>
  const stateEl = document.getElementById('state');
  const cmdEl = document.getElementById('command');
  const currentEl = document.getElementById('current');
  const countersEl = document.getElementById('counters');
  const recentEl = document.getElementById('recent');
  const errorEl = document.getElementById('error');
  // A refused run control keeps its message for a few seconds; the 1.5 s
  // poll would otherwise clear it before anyone could read it.
  let controlErrorUntil = 0;
  function setError(text) {
    if (Date.now() < controlErrorUntil) return;
    errorEl.textContent = text;
  }
  const pauseBtn = document.getElementById('pauseBtn');
  const unpauseBtn = document.getElementById('unpauseBtn');
  const stopBtn = document.getElementById('stopBtn');

  // Idle: say so, with the library size and where to look next. The total
  // is fetched once per idle spell, not on every 1.5 s poll.
  const idleEl = document.getElementById('idle-empty');
  let idleShown = false;
  async function showIdle() {
    if (idleShown) return;
    idleShown = true;
    currentEl.style.display = 'none';  // the card says it; no "(no active item)" too
    const box = renderEmpty(idleEl, 'No run in progress',
                            'Start one from the terminal, for example',
                            'pyimgtag run --input-dir <folder>');
    const more = document.createElement('p');
    const total = document.createElement('span');
    total.className = 'idle-total';
    more.appendChild(total);
    more.appendChild(document.createTextNode(' Browse the '));
    const review = document.createElement('a');
    review.href = '/review';
    review.textContent = 'Review';
    more.appendChild(review);
    more.appendChild(document.createTextNode(' page or the library '));
    const insights = document.createElement('a');
    insights.href = '/insights';
    insights.textContent = 'Insights';
    more.appendChild(insights);
    more.appendChild(document.createTextNode('.'));
    box.appendChild(more);
    try {
      const stats = await apiFetch('/review/api/stats');
      total.textContent = 'Library: ' + stats.total + ' photo(s) tagged.';
    } catch (_e) { /* the standalone dashboard has no library API: leave it out */ }
  }
  function hideIdle() {
    if (!idleShown) return;
    idleShown = false;
    idleEl.innerHTML = '';
    currentEl.style.display = '';
  }

  async function refresh() {
    try {
      const d = await apiFetch('/api/run/current');
      if (!d.active) {
        showIdle();
        stateEl.textContent = 'idle';
        stateEl.className = 'pill-state';
        cmdEl.textContent = '';
        currentEl.textContent = '(no active item)';
        countersEl.innerHTML = '';
        recentEl.innerHTML = '';
        setError('');
        pauseBtn.disabled = true;
        unpauseBtn.disabled = true;
        stopBtn.disabled = true;
        return;
      }
      hideIdle();
      // `watch` idles between poll cycles while still "running" — label it so
      // the user can tell a live daemon from a batch run.
      const isWatching = d.command === 'watch' && (d.state || 'running') === 'running';
      stateEl.textContent = isWatching ? 'watching' : (d.state || 'running');
      stateEl.className = 'pill-state ' + (d.state || 'running');
      cmdEl.textContent = d.command || '';
      currentEl.innerHTML = '';
      if (d.current_item) {
        // Click-through into the review page filtered to this single image
        // so the user can inspect the model's output for the file currently
        // being processed.
        const a = document.createElement('a');
        a.href = '/review?file=' + encodeURIComponent(d.current_item);
        a.textContent = d.current_item;
        a.title = 'View result for this image';
        currentEl.appendChild(a);
      } else {
        currentEl.textContent = '(no active item)';
      }
      setError(d.last_error || '');
      pauseBtn.disabled = d.state !== 'running';
      // Resuming is also allowed while a pause is still pending — the server
      // cancels a PAUSING state the same way it resumes a PAUSED one.
      unpauseBtn.disabled = d.state !== 'paused' && d.state !== 'pausing';
      stopBtn.disabled = d.state === 'completed' || d.state === 'interrupted' || d.state === 'failed';
      countersEl.innerHTML = '';
      for (const [k, v] of Object.entries(d.counters || {})) {
        const card = document.createElement('div');
        card.className = 'stat-card';
        const val = document.createElement('div');
        val.className = 'stat-val';
        val.textContent = v;
        const lbl = document.createElement('div');
        lbl.className = 'stat-label';
        lbl.textContent = k;
        card.appendChild(val);
        card.appendChild(lbl);
        countersEl.appendChild(card);
      }
      recentEl.innerHTML = '';
      for (const item of (d.recent || [])) {
        const li = document.createElement('li');
        li.className = 'recent-li';
        li.style.flexWrap = 'wrap';
        const s = document.createElement('span');
        s.className = 'recent-status ' + (item.status || '');
        s.textContent = item.status || '';
        const p = document.createElement('span');
        p.className = 'recent-path';
        if (item.path) {
          const a = document.createElement('a');
          a.href = '/review?file=' + encodeURIComponent(item.path);
          a.textContent = item.path;
          a.title = 'View result for this image';
          p.appendChild(a);
        }
        li.appendChild(s);
        li.appendChild(p);
        if (item.detail || item.error) {
          const d2 = document.createElement('span');
          d2.style.cssText = 'flex-basis:100%;padding-left:52px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
          d2.textContent = item.detail || ('error: ' + item.error);
          li.appendChild(d2);
        }
        recentEl.appendChild(li);
      }
    } catch (e) { setError('Status unavailable: ' + e.message); }
  }

  // Run controls: a refused action (e.g. 404 "no active run") is shown in
  // the error line instead of silently doing nothing.
  async function control(action, url) {
    try {
      await apiFetch(url, {method: 'POST'});
    } catch (err) {
      controlErrorUntil = 0;
      setError('Could not ' + action + ': ' + err.message);
      controlErrorUntil = Date.now() + 6000;
      return;
    }
    controlErrorUntil = 0;  // a later success replaces an earlier refusal
    refresh();
  }
  pauseBtn.addEventListener('click', () => control('pause', '/api/run/current/pause'));
  unpauseBtn.addEventListener('click', () => control('unpause', '/api/run/current/unpause'));
  stopBtn.addEventListener('click', () => {
    if (!confirm('Stop the run after the current image finishes?')) return;
    control('stop', '/api/run/current/stop');
  });

  refresh();
  setInterval(refresh, 1500);
</script></body></html>
