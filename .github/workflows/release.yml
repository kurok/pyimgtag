name: Auto Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: version
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Generate changelog from commits
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          RANGE="${PREV_TAG}..HEAD"
        else
          RANGE="HEAD"
        fi
        # Use an unpredictable heredoc delimiter so a commit subject line cannot
        # terminate the block and inject additional $GITHUB_OUTPUT variables.
        DELIM="CHANGELOG_$(uuidgen)"
        {
          echo "changelog<<$DELIM"
          git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
          echo ""
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
      with:
        name: "v${{ steps.version.outputs.version }}"
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.changelog }}
        generate_release_notes: true
