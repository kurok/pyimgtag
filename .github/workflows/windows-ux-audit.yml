name: Windows UX audit

on:
  workflow_dispatch:
  push:
    branches: [ "test/windows-ux-audit" ]

permissions:
  contents: read

jobs:
  windows-ux-audit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyimgtag and the audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[heic,review,dedup,vocab,mcp]"
          python -m pip install piexif

      - name: Install exiftool
        shell: pwsh
        run: |
          choco install exiftool -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path", "User")
          exiftool -ver

      - name: Run the Windows UX audit
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/ux/windows-ux-audit.ps1 -WorkDir "C:\ux" 2>&1 |
            Tee-Object -FilePath "audit1.out"

      - name: Run the Windows-specific checks
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/ux/windows-ux-audit2.ps1 -WorkDir "C:\ux2" 2>&1 |
            Tee-Object -FilePath "audit2.out"

      - name: Collect the transcripts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "audit-logs" | Out-Null
          Copy-Item "audit1.out","audit2.out" "audit-logs\" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\ux\*.log","C:\ux2\*.log" "audit-logs\" -Force -ErrorAction SilentlyContinue

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ux-audit-log
          path: |
            audit-logs/
            audit1.out
            audit2.out
          if-no-files-found: warn
