name: Windows UX audit

on:
  workflow_dispatch:
  push:
    branches: [ "test/windows-ux-audit" ]

permissions:
  contents: read

jobs:
  windows-ux-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyimgtag and the audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[heic,review,dedup,vocab,mcp,search]"
          python -m pip install piexif

      - name: Install exiftool
        shell: pwsh
        run: |
          choco install exiftool -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path", "User")
          exiftool -ver

      - name: Run the Windows UX audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          powershell -ExecutionPolicy Bypass -File scripts/ux/windows-ux-audit.ps1 -WorkDir "C:\ux" 2>&1 |
            Tee-Object -FilePath "windows-ux-audit.out"
          Get-Content "C:\ux\windows-ux-audit.log" -ErrorAction SilentlyContinue

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ux-audit-log
          path: |
            windows-ux-audit.out
            C:\ux\*.log
          if-no-files-found: warn
